[project]
name = "specgraph"
version = "0.1.0"
description = "product-docs draft 브랜치 PRD 를 LightRAG 로 챕터 단위 증분 인덱싱하고 MCP 도구로 제공하는 GraphRAG PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightrag-hku>=1.5.7",
    "fastmcp>=4.0.10",
    "pydantic-settings>=2.7",
    "asyncpg>=0.30",
    "httpx>=0.28",
    # LightRAG 은 아래 두 패키지가 없으면 import 시점에 pip 로 자동 설치를 시도한다(pipmaster).
    # 런타임 설치를 막기 위해 명시적으로 고정한다.
    "ollama>=0.5.4",
    "pgvector>=0.3",
    "numpy>=2.5.3",
]

[project.scripts]
specgraph-indexer = "specgraph.indexer.__main__:main"
specgraph-mcp = "specgraph.mcp_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
markers = [
    "integration: 외부 서비스(PostgreSQL · Ollama · LightRAG · 임베딩)가 필요한 테스트. 기본 실행에서 -m 'not integration' 으로 제외",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Graph Engineering 런타임(.claude/**)은 이 프로젝트 코드가 아니므로 검사하지 않는다.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["specgraph"]
